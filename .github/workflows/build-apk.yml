name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/
          cp sw.js www/
          cp -r icon www/

      - name: Check Capacitor
        run: npx cap --version

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      # Regenerates every native Android icon size (mipmap-mdpi..xxxhdpi, round + adaptive)
      # from a single 1024x1024 source image every build. Nothing native is hand-maintained;
      # to change the app icon in future, replace resources/icon.png and push — nothing else
      # in this workflow needs to change.
      - name: Generate native Android icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#062118" --iconBackgroundColorDark "#062118"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Without this, Gradle auto-generates a brand-new random debug key on every run
      # (GitHub Actions runners are fresh VMs each time), so no two builds could ever
      # update over each other. Restoring the same keystore every time — at Gradle's
      # default path with its default alias/passwords — fixes that with zero changes
      # to any Gradle config file.
      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spend-tracker-release
          path: android/app/build/outputs/apk/debug/app-debug.apk
