name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/
          cp sw.js www/
          cp -r icon www/

      - name: Check Capacitor
        run: npx cap --version

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Generate native Android icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#062118" --iconBackgroundColorDark "#062118"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # -i / --ignore-garbage tells base64 to silently skip any stray whitespace,
      # newlines, or non-base64 characters instead of hard-failing on them - a
      # defensive fix in case a secret ever picks up formatting artifacts again
      # from a copy/paste. It does NOT mask a genuinely wrong or truncated value.
      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d -i > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore || (echo "Keystore is empty after decode - secret is missing or invalid" && exit 1)
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spend-tracker-release
          path: android/app/build/outputs/apk/debug/app-debug.apk
